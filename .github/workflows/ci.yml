# Linux remains the merge bar (full generate() pipeline + corpus).
# Windows must compile and pass this fork's independent-mesh path.
# Legacy generate() steps on Windows stay non-blocking: they fail on
# vcpkg OCCT the same way they fail on main.
name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OCCT
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libocct-foundation-dev libocct-modeling-data-dev \
            libocct-modeling-algorithms-dev libocct-data-exchange-dev \
            libocct-ocaf-dev libocct-visualization-dev ninja-build \
            libglfw3-dev libgl1-mesa-dev libtbb-dev libfontconfig1-dev
      - name: Configure + build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Pipeline tests
        run: ctest --test-dir build --output-on-failure
      - name: Coverage report
        run: tools/coverage_report.sh
      - name: Corpus gate
        run: tools/corpus_gate.sh --no-golden
      - name: Topology signature fixture set
        run: |
          mkdir -p build/topology_signatures
          tools/topology_signature.sh fixture-set -o build/topology_signatures
          tools/topology_signature.sh self-check
      - name: Topology signature release set (Linux reference)
        run: |
          mkdir -p build/topology_signatures/release
          tools/topology_signature.sh release-set -o build/topology_signatures/release
      - name: Upload topology signatures
        uses: actions/upload-artifact@v4
        with:
          name: topology-signatures-linux
          path: build/topology_signatures/
          if-no-files-found: warn
      - name: Public corpus (optional; skipped unless WEFT_RUN_PUBLIC=1)
        continue-on-error: true
        run: tools/public_corpus_gate.sh
      - name: Strict release gate
        run: tools/release_gate.sh

  windows:
    # Linux remains the merge bar. This job must compile and pass the
    # independent-mesh tests. Legacy generate() pipeline/corpus/release
    # steps stay non-blocking: they fail on Windows vcpkg OCCT the same
    # way they fail on main (not this fork's product path).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OCCT (vcpkg, cached)
        uses: johnwason/vcpkg-action@v6
        with:
          pkgs: opencascade
          triplet: x64-windows-release
          token: ${{ github.token }}
          github-binarycache: true
      - name: Configure + build
        shell: pwsh
        run: |
          cmake -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-release `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j 4
      - name: Deploy vendored OCCT third-party DLLs
        shell: pwsh
        run: |
          $src = "third_party/occt-win-runtime"
          $dst = "build/bin/Release"
          if (-not (Test-Path "$src/tbb12.dll")) {
            throw "Missing vendored runtime $src/tbb12.dll — check git LFS / checkout"
          }
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Copy-Item "$src/*.dll" $dst -Force
          foreach ($n in @("tbb12.dll","jemalloc.dll","FreeImage.dll","openvr_api.dll","freetype.dll")) {
            if (-not (Test-Path "$dst/$n")) { throw "Required DLL missing after deploy: $n" }
          }
          Write-Host "Vendored OCCT runtimes deployed next to Release binaries"
      - name: Independent mesh and unit tests
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure `
            -R "independent_mesh|bake_queue|topology_cache|geometry_pool"
      - name: Independent mesh CLI smoke
        shell: pwsh
        run: |
          $weft = "build/bin/Release/weft.exe"
          $step = Join-Path $env:TEMP "weft_win_cyl.step"
          $obj = Join-Path $env:TEMP "weft_win_cyl.obj"
          & $weft fixture $step --shape cylinder
          if ($LASTEXITCODE -ne 0) { throw "fixture failed: $LASTEXITCODE" }
          & $weft mesh $step -o $obj --independent --validate
          if ($LASTEXITCODE -ne 0) { throw "independent mesh CLI smoke failed: $LASTEXITCODE" }
      - name: Pipeline tests (legacy generate)
        continue-on-error: true
        shell: pwsh
        run: ctest --test-dir build -C Release -R pipeline --output-on-failure
      - name: Coverage report
        shell: bash
        run: tools/coverage_report.sh
      - name: Independent mesh signature determinism
        shell: pwsh
        run: |
          $weft = "build/bin/Release/weft.exe"
          $step = Join-Path $env:TEMP "weft_win_sig.step"
          $a = Join-Path $env:TEMP "weft_win_sig_a.sig"
          $b = Join-Path $env:TEMP "weft_win_sig_b.sig"
          $oa = Join-Path $env:TEMP "weft_win_sig_a.obj"
          $ob = Join-Path $env:TEMP "weft_win_sig_b.obj"
          & $weft fixture $step --shape cylinder
          if ($LASTEXITCODE -ne 0) { throw "fixture failed: $LASTEXITCODE" }
          & $weft mesh $step -o $oa --independent --validate --signature $a
          if ($LASTEXITCODE -ne 0) { throw "independent mesh a failed: $LASTEXITCODE" }
          & $weft mesh $step -o $ob --independent --validate --signature $b
          if ($LASTEXITCODE -ne 0) { throw "independent mesh b failed: $LASTEXITCODE" }
          & $weft signature-compare $a $b
          if ($LASTEXITCODE -ne 0) { throw "independent signatures not policy-equal: $LASTEXITCODE" }
      - name: Topology signature self-check (legacy generate)
        continue-on-error: true
        shell: bash
        run: |
          WEFT=build/bin/Release/weft.exe \
            tools/topology_signature.sh self-check
      - name: Corpus invariants
        continue-on-error: true
        shell: bash
        run: |
          WEFT=build/bin/Release/weft.exe \
            tools/corpus_gate.sh --no-golden
      - name: Public corpus (optional; skipped unless WEFT_RUN_PUBLIC=1)
        continue-on-error: true
        shell: bash
        run: |
          WEFT=build/bin/Release/weft.exe \
            tools/public_corpus_gate.sh
      - name: Strict release gate
        continue-on-error: true
        shell: bash
        run: |
          WEFT=build/bin/Release/weft.exe \
            tools/release_gate.sh
      - name: Download Linux topology signatures
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: topology-signatures-linux
          path: build/topology_signatures-linux
      - name: Topology signature release set (Windows) + compare
        continue-on-error: true
        shell: bash
        run: |
          WEFT=build/bin/Release/weft.exe
          mkdir -p build/topology_signatures/release
          tools/topology_signature.sh release-set -o build/topology_signatures/release
          fail=0
          if [[ ! -d build/topology_signatures-linux/release ]]; then
            echo "WARN: Linux topology signatures unavailable; skip cross-OS compare"
            exit 0
          fi
          for sig in build/topology_signatures/release/*.sig; do
            base=$(basename "$sig")
            ref="build/topology_signatures-linux/release/$base"
            if [[ ! -f "$ref" ]]; then
              echo "FAIL missing Linux reference $ref"
              fail=1
              continue
            fi
            echo "== compare $base =="
            if ! "$WEFT" signature-compare "$ref" "$sig"; then
              echo "FAIL $base not policy-equal across Linux/Windows"
              fail=1
            else
              echo "ok $base"
            fi
          done
          exit "$fail"
